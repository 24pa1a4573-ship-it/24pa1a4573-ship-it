<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="900" height="90" role="img" aria-label="Footer decoration">
  <title>Footer</title>
  <defs>
    <linearGradient id="kf-bg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#100700"/>
      <stop offset="50%" stop-color="#190812"/>
      <stop offset="100%" stop-color="#100700"/>
    </linearGradient>
    <linearGradient id="kf-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#100700" stop-opacity="0"/>
      <stop offset="25%" stop-color="#451126"/>
      <stop offset="50%" stop-color="#C77598">
        <animate attributeName="stop-color" values="#C77598;#705A3D;#C77598" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#451126"/>
      <stop offset="100%" stop-color="#100700" stop-opacity="0"/>
    </linearGradient>
    <filter id="kf-glow" x="-5%" y="-100%" width="110%" height="300%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="kf-blur"/>
      <feFlood flood-color="#C77598" flood-opacity="0.5" result="kf-color"/>
      <feComposite in="kf-color" in2="kf-blur" operator="in" result="kf-glow"/>
      <feMerge>
        <feMergeNode in="kf-glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="kf-dots" x="0" y="0" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#705A3D" opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="900" height="90" fill="#100700"/>
  <rect width="900" height="90" fill="url(#kf-bg-grad)"/>
  <rect width="900" height="90" fill="url(#kf-dots)"/>

  <!-- Top decorative line -->
  <rect x="0" y="0" width="900" height="1.5" fill="url(#kf-line-grad)"/>

  <!-- Main centerline -->
  <rect x="100" y="43" width="700" height="1" rx="0.5" fill="url(#kf-line-grad)" filter="url(#kf-glow)" opacity="0.7"/>

  <!-- Animated scanning shimmer -->
  <rect x="-200" y="42" width="200" height="3" rx="1.5" fill="#C77598" opacity="0.25">
    <animate attributeName="x" from="-200" to="900" dur="4s" repeatCount="indefinite" calcMode="linear"/>
  </rect>

  <!-- Center diamond -->
  <polygon points="450,35 456,43 450,51 444,43" fill="none" stroke="#C77598" stroke-width="1" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="450" cy="43" r="2" fill="#C77598" opacity="0.9">
    <animate attributeName="r" values="1.5;2.5;1.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Left cluster -->
  <circle cx="360" cy="43" r="1.5" fill="#705A3D" opacity="0.6"/>
  <circle cx="375" cy="43" r="1" fill="#451126" opacity="0.5"/>
  <circle cx="387" cy="43" r="1.5" fill="#705A3D" opacity="0.6"/>

  <!-- Right cluster -->
  <circle cx="513" cy="43" r="1.5" fill="#705A3D" opacity="0.6"/>
  <circle cx="525" cy="43" r="1" fill="#451126" opacity="0.5"/>
  <circle cx="540" cy="43" r="1.5" fill="#705A3D" opacity="0.6"/>

  <!-- Left text -->
  <text x="110" y="48" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="600" letter-spacing="2.5" fill="#C77598" opacity="0.9">
    KARTHIK MEDURI
  </text>

  <!-- Right text -->
  <text x="790" y="48" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="600" letter-spacing="2.5" fill="#C77598" opacity="0.9" text-anchor="end">
    github.com/24pa1a4573-ship-it
  </text>

  <!-- Corner marks -->
  <rect x="6" y="6" width="14" height="1.5" fill="#C77598" opacity="0.6"/>
  <rect x="6" y="6" width="1.5" height="14" fill="#C77598" opacity="0.6"/>
  <rect x="880" y="6" width="14" height="1.5" fill="#C77598" opacity="0.6"/>
  <rect x="893" y="6" width="1.5" height="14" fill="#C77598" opacity="0.6"/>
</svg>
